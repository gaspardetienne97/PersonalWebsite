packages:
  - apps/*
  - packages/*

catalog:
  # Core
  "@chromatic-com/storybook": ^5.6.0
  "@fontsource-variable/outfit": ^5.3.0

  # Misc
  "@fontsource/fira-mono": ^5.3.0

  # i18n
  "@inlang/paraglide-js": ^3.2.2
  "@internationalized/date": ^3.10.1

  # Testing
  "@playwright/test": ^1.65.1
  "@spotify/basic-pitch": 1.0.1
  "@spotify/web-api-ts-sdk": ^1.2.0
  "@storybook/addon-a11y": ^10.6.8
  "@storybook/addon-docs": ^10.6.8
  "@storybook/addon-svelte-csf": ^5.1.6
  "@storybook/addon-vitest": ^10.6.8
  "@storybook/sveltekit": ^10.6.8
  "@sveltejs/adapter-node": ^6.0.5

  # SvelteKit
  "@sveltejs/kit": ^3.4.0
  "@sveltejs/vite-plugin-svelte": ^7.3.1
  "@tailwindcss/container-queries": ^0.1.1
  "@tailwindcss/forms": ^0.5.11
  "@tailwindcss/typography": ^0.5.20
  "@tailwindcss/vite": ^4.3.5
  "@tensorflow/tfjs": 3.21.0
  "@tonejs/midi": ^2.0.28
  "@types/node": ^26.6.6
  "@vite-pwa/sveltekit": ^2.0.3
  "@vitest/browser-playwright": 5.1.0

  # Auth
  better-auth: ~1.7.26

  # UI
  bits-ui: ^2.21.0
  clsx: ^2.1.1
  dexie: ^4.4.7
  drizzle-kit: ^0.31.11

  # DB
  drizzle-orm: ^0.45.4
  embla-carousel-svelte: ^8.6.0

  # Linting
  eslint: ^10.0.3
  eslint-config-prettier: ^10.1.8
  eslint-plugin-storybook: ^10.3.4
  eslint-plugin-svelte: ^3.15.2
  globals: ^17.4.0
  jszip: ^3.10.2
  kokoro-js: ^1.2.1
  "@lucide/svelte": ^1.77.0
  magicast: ^0.5.5
  mdsvex: ^1.0.1
  mode-watcher: 1.1.0
  pdfjs-dist: ^6.5.438
  playwright: ^1.65.1
  postgres: ^4.1.1
  prettier: ^3.8.1
  prettier-plugin-svelte: ^3.4.1
  prettier-plugin-tailwindcss: ^0.7.2

  # Storybook
  storybook: ^10.6.7
  svelte: ^5.58.0
  svelte-check: ^4.7.8
  svelte-sonner: ^1.2.3
  tailwind-merge: ^3.7.1
  tailwind-variants: ^4.0.2
  tailwindcss: ^4.3.5
  tailwindcss-animate: ^1.0.7
  tone: ^15.1.22
  tsx: ^4.23.15
  typescript: ^6.0.3
  typescript-eslint: ^8.57.0
  vexflow: ^5.6.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plugin-devtools-json: ^1.1.2
  vite-plugin-pwa: ^2.0.0
  vite-plus: 1.7.0
  vitest: 5.1.0
  vitest-browser-svelte: ^3.1.0
  workbox-window: ^7.4.1

catalogMode: prefer

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: "*"
    # bits-ui's runed still declares SvelteKit 2; it only touches kit in a subpath bits-ui doesn't use.
    runed>@sveltejs/kit: "3"
